        <input type="time" value="${r.time}" onchange="updateRem('${r.id}','time',this.value)">
        <label style="color:var(--ink);flex:0 0 auto"><input type="checkbox" class="switch" ${r.on?"checked":""} onchange="updateRem('${r.id}','on',this.checked)"> <span data-t="on"></span></label>
        <button class="small danger" style="flex:0 0 auto;width:44px;padding:0;justify-content:center" onclick="deleteRem('${r.id}')">${ICON.trash}</button>
      </div>
    </div>`;
  }).join("") : `<p class="muted">${esc(t("noRem"))}</p>`;
  const today = history.filter(h => h.date===todayStr());
  document.getElementById("history").innerHTML = today.length ? today.map(h =>
    `<div class="hist"><span>${esc(h.time)} — ${ICON.pillTeal} ${esc(h.med)}</span><b>${h.status==="taken"?esc(t("taken")):esc(t("missed"))}</b></div>`).join("")
    : `<p class="muted">${esc(t("noHist"))}</p>`;
}
function updateRem(id, key, val){
  const r = reminders.find(x=>x.id===id); if(!r) return;
  r[key] = val; if(key==="time") r.lastFired = "";
  store("ml_reminders", reminders); renderHomeNext();
}
function deleteRem(id){ reminders = reminders.filter(r=>r.id!==id); store("ml_reminders", reminders); renderAll(); }

function renderHomeNext(){
  const box = document.getElementById("nextReminder");
  if(!box) return;
  const now = nowHM();
  const upcoming = reminders.filter(r => r.on && medById(r.medId)).sort((a,b)=>a.time.localeCompare(b.time));
  const next = upcoming.find(r => r.time > now) || upcoming[0];
  if(!next){ box.classList.add("hidden"); return; }
  const m = medById(next.medId);
  box.classList.remove("hidden");
  box.innerHTML = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:4px;display:inline-block"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg> <b>${esc(t("next"))}:</b> <span style="font-size:26px;font-weight:800">${esc(next.time)}</span> — ${ICON.pillWhite} ${esc(m.brand||m.generic)}`;
}
function renderAll(){ renderMeds(); renderReminders(); renderHomeNext(); if(lastScan.length) renderResults(); updateTopBar(); updateSidebar(); }

function checkAlarms(){
  const now = nowHM(), today = todayStr(), ts = Date.now();
  reminders.forEach(r => {
    if(r.on && r.time===now && r.lastFired!==today && medById(r.medId)){
      r.lastFired = today; store("ml_reminders", reminders);
      queueAlarm(r);
    }
  });
  snoozes = snoozes.filter(s => {
    if(s.at <= ts){ const r = reminders.find(x=>x.id===s.reminderId); if(r) queueAlarm(r); return false; }
    return true;
  });
  renderHomeNext();
}
function queueAlarm(r){ alarmQueue.push(r); if(!activeAlarm) nextAlarm(); }

function nextAlarm(){
  const r = alarmQueue.shift(); if(!r) return;
  const m = r.test ? r.med : medById(r.medId); if(!m) return nextAlarm();
  activeAlarm = {reminder:r, med:m};
  const name = m.brand || m.generic;
  document.getElementById("alarmTitle").textContent = "⏰ " + t("timeTitle");
  document.getElementById("alarmMed").innerHTML = `<b style="font-size:30px">${esc(name)}</b><br>${m.confidence==="low"?"":esc(m.dose)} ${m.food!=="unspecified"?"🍽️ "+esc(foodText(m.food, lang)):""}`;
  document.getElementById("alarmText").textContent = T[lang].alarmVoice;
  document.getElementById("alarm").classList.add("show");
  try{ if("Notification" in window && Notification.permission==="granted") new Notification("💊 MedLens — " + t("timeTitle"), {body:name + (m.dose?" — "+m.dose:""), requireInteraction:true}); }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([400,200,400,200,400]); }catch(e){}
  beep();
  activeAlarm.beepTimer = setInterval(beep, 2500);
  announce();
  activeAlarm.voiceTimer = setInterval(announce, 60000);
  activeAlarm.missTimer = setTimeout(() => endAlarm("missed"), 15*60000);
}
async function announce(){
  if(!activeAlarm) return;
  const m = activeAlarm.med, name = m.brand || m.generic;
  clearInterval(activeAlarm.beepTimer);
  try{ speechSynthesis.cancel(); }catch(e){}
  if(lang==="ur"){
    let spoken = false;
    if(hasUrduVoice()){ await speak(T.ur.alarmVoice + " " + name + "۔", "ur"); spoken = true; }
    else { spoken = await playUrduRecording(); }
    if(!spoken) await speak(T.en.alarmVoice + " " + name + ".", "en");
  }else{
    await speak(T.en.alarmVoice + " " + name + (m.dose && m.confidence!=="low" ? ". " + m.dose + "." : "."), "en");
  }
  if(activeAlarm){ clearInterval(activeAlarm.beepTimer); activeAlarm.beepTimer = setInterval(beep, 2500); }
}
function endAlarm(status){
  if(!activeAlarm) return;
  const {reminder, med} = activeAlarm;
  clearInterval(activeAlarm.beepTimer); clearInterval(activeAlarm.voiceTimer); clearTimeout(activeAlarm.missTimer);
  try{ speechSynthesis.cancel(); }catch(e){}
  if(status && !reminder.test){
    history.push({date:todayStr(), time:nowHM(), med:med.brand||med.generic, status});
    store("ml_history", history);
  }
  activeAlarm = null;
  document.getElementById("alarm").classList.remove("show");
  renderAll();
  setTimeout(nextAlarm, 500);
}
function alarmTook(){ endAlarm("taken"); }
function alarmSnooze(){
  if(!activeAlarm) return;
  const r = activeAlarm.reminder;
  if(!r.test) snoozes.push({reminderId:r.id, at:Date.now() + 10*60000});
  endAlarm(null);
}
function testAlarm(){
  const m = meds[0] || {brand:t("testMed"), generic:"", dose:"1 tablet", food:"after", confidence:"high", timing:["morning"]};
  queueAlarm({id:"test", test:true, med:m});
}

function initEcgPulse(){
  const pulse = document.getElementById("ecgPulse");
  if(!pulse) return;
  try{
    const totalLen = Math.round(pulse.getTotalLength() || 1600);
    const pulseLen = Math.round(Math.min(180, totalLen * 0.12));
    pulse.style.strokeDasharray = `${pulseLen} ${totalLen}`;

    const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(prefersReduced){
      pulse.style.display = 'none';
      return;
    }

    if(pulse.animate){
      pulse.animate([
        { strokeDashoffset: pulseLen },
        { strokeDashoffset: -totalLen }
      ], {
        duration: 6000,
        iterations: Infinity,
        easing: 'linear'
      });
    }
  }catch(e){
    console.warn("ECG animation init", e);
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initEcgPulse);
} else {
  initEcgPulse();
}
window.addEventListener('resize', () => { setTimeout(initEcgPulse, 200); }, { passive: true });

applyLang();
setInterval(checkAlarms, 15000);
checkAlarms();
</script>

<script>
/* ================= FLOATING 3D MEDICINE OBJECTS CANVAS ================= */
(function(){
  const canvas = document.getElementById("medCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  if(!ctx) return;

  let width = 0, height = 0, dpr = 1;
  let animId = null;
  let isRunning = false;
  let isVisible = true;
  let prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Parallax tracking
  let targetMouseX = 0, targetMouseY = 0;
  let mouseX = 0, mouseY = 0;

  window.addEventListener('mousemove', e => {
    targetMouseX = (e.clientX / (window.innerWidth || 1)) - 0.5;
    targetMouseY = (e.clientY / (window.innerHeight || 1)) - 0.5;
  }, { passive: true });

  // Capsule color presets (muted) + cream partner
  const CAPSULE_COLORS = [
    "#c4757c", // rose
    "#5fa597", // teal
    "#6f9fb2", // blue
    "#c99a6b", // sand
    "#8c8fc4"  // lavender
  ];
  const CREAM_COLOR = "#faf7f0";

  // Total 18 objects: 50% capsules (9), 25% tablets (5), 25% crosses (4)
  const objects = [];

  function createObject(type, i, randomY = false){
    const z = 0.35 + Math.random() * 0.65;
    const x = Math.random() * (width || window.innerWidth || 800);
    const y = randomY ? Math.random() * (height || window.innerHeight || 600) : ((height || window.innerHeight || 600) + 40 + Math.random() * 100);

    return {
      type,
      x,
      y,
      z,
      baseSpeed: 0.35 + Math.random() * 0.45,
      swaySpeed: 0.0008 + Math.random() * 0.0012,
      phase: Math.random() * Math.PI * 2,
      
      // 3D Rotations
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.008,
      pitch: Math.random() * Math.PI * 2,
      pitchSpeed: 0.006 + Math.random() * 0.008,

      // Specifics
      color: type === 'capsule' ? CAPSULE_COLORS[i % CAPSULE_COLORS.length] : null,
      scoreAngle: Math.random() * Math.PI,
      tilt: 0.35 + Math.random() * 0.45
    };
  }

  function initObjects(){
    objects.length = 0;
    // 9 capsules (50%)
    for(let i = 0; i < 9; i++){
      objects.push(createObject('capsule', i, true));
    }
    // 5 round tablets (25%)
    for(let i = 0; i < 5; i++){
      objects.push(createObject('tablet', i, true));
    }
    // 4 medical plus crosses (25%)
    for(let i = 0; i < 4; i++){
      objects.push(createObject('cross', i, true));
    }
  }

  function resize(){
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if(objects.length === 0){
      initObjects();
    }
    if(prefersReduced){
      renderFrame(0);
    }
  }

  // Draw 3D Capsule
  function drawCapsule(o, px, py){
    const scale = (0.55 + o.z * 0.45);
    const alpha = (0.22 + o.z * 0.48);
    const L = 38 * scale;
    const R = 11.5 * scale;
    const pitchCos = Math.cos(o.pitch);
    const Le = Math.max(3, L * Math.abs(pitchCos));

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(o.rot);
    ctx.globalAlpha = alpha;

    // Soft drop shadow
    ctx.save();
    ctx.translate(0, 16 * scale);
    ctx.scale(1, 0.45);
    ctx.beginPath();
    ctx.arc(0, 0, Le * 0.55 + R, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(10, 20, 25, 0.20)";
    ctx.fill();
    ctx.restore();

    // Two-color capsule: left cream, right color (or vice versa based on pitch)
    const colLeft = pitchCos >= 0 ? CREAM_COLOR : o.color;
    const colRight = pitchCos >= 0 ? o.color : CREAM_COLOR;

    // Left half
    ctx.save();
    ctx.beginPath();
    ctx.arc(-Le / 2, 0, R, Math.PI / 2, Math.PI * 1.5);
    ctx.lineTo(0, -R);
    ctx.lineTo(0, R);
    ctx.closePath();
    ctx.fillStyle = colLeft;
    ctx.fill();

    // Left half gradient shading across width
    const shadeLeft = ctx.createLinearGradient(0, -R, 0, R);
    shadeLeft.addColorStop(0, "rgba(0, 0, 0, 0.22)");
    shadeLeft.addColorStop(0.28, "rgba(255, 255, 255, 0.35)");
    shadeLeft.addColorStop(0.55, "rgba(255, 255, 255, 0.04)");
    shadeLeft.addColorStop(1, "rgba(0, 0, 0, 0.28)");
    ctx.fillStyle = shadeLeft;
    ctx.fill();
    ctx.restore();

    // Right half
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, -R);
    ctx.lineTo(Le / 2, -R);
    ctx.arc(Le / 2, 0, R, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(0, R);
    ctx.closePath();
    ctx.fillStyle = colRight;
    ctx.fill();

    // Right half gradient shading
    const shadeRight = ctx.createLinearGradient(0, -R, 0, R);
    shadeRight.addColorStop(0, "rgba(0, 0, 0, 0.22)");
    shadeRight.addColorStop(0.28, "rgba(255, 255, 255, 0.35)");
    shadeRight.addColorStop(0.55, "rgba(255, 255, 255, 0.04)");
    shadeRight.addColorStop(1, "rgba(0, 0, 0, 0.28)");
    ctx.fillStyle = shadeRight;
    ctx.fill();
    ctx.restore();

    // Seam line
    ctx.beginPath();
    ctx.moveTo(0, -R);
    ctx.lineTo(0, R);
    ctx.strokeStyle = "rgba(0, 0, 0, 0.16)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // White highlight streak
    ctx.beginPath();
    ctx.moveTo(-Le / 2 + R * 0.3, -R * 0.52);
    ctx.lineTo(Le / 2 - R * 0.3, -R * 0.52);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
    ctx.lineWidth = 1.6 * scale;
    ctx.lineCap = "round";
    ctx.stroke();

    ctx.restore();
  }

  // Draw 3D Round White Tablet with score line
  function drawTablet(o, px, py){
    const scale = (0.55 + o.z * 0.45);
    const alpha = (0.22 + o.z * 0.48);
    const R = 17 * scale;
    const H = 6.5 * scale;
    const tilt = o.tilt;
    const ry = Math.max(3, R * Math.cos(tilt));
    const h = H * Math.sin(tilt);

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(o.rot * 0.3);
    ctx.globalAlpha = alpha;

    // Drop shadow
    ctx.save();
    ctx.translate(0, (h + 12) * scale);
    ctx.scale(1, 0.4);
    ctx.beginPath();
    ctx.arc(0, 0, R * 1.05, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(10, 20, 25, 0.18)";
    ctx.fill();
    ctx.restore();

    // Edge thickness
    if(h > 0.5){
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(0, h, R, ry, 0, 0, Math.PI);
      ctx.lineTo(-R, 0);
      ctx.ellipse(0, 0, R, ry, 0, Math.PI, 0, true);
      ctx.closePath();

      const edgeGrad = ctx.createLinearGradient(-R, 0, R, 0);
      edgeGrad.addColorStop(0, "#c9c6bc");
      edgeGrad.addColorStop(0.4, "#f0ede4");
      edgeGrad.addColorStop(0.7, "#dedad0");
      edgeGrad.addColorStop(1, "#bebbb1");
      ctx.fillStyle = edgeGrad;
      ctx.fill();
      ctx.restore();
    }

    // Top face
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, R, ry, 0, 0, Math.PI * 2);
    const faceGrad = ctx.createRadialGradient(-R * 0.2, -ry * 0.3, 2, 0, 0, R);
    faceGrad.addColorStop(0, "#ffffff");
    faceGrad.addColorStop(0.65, "#f6f4ee");
    faceGrad.addColorStop(1, "#e6e3da");
    ctx.fillStyle = faceGrad;
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // Score line across tablet face
    const a = o.scoreAngle + o.rot;
    const sx = Math.cos(a) * R * 0.78;
    const sy = Math.sin(a) * ry * 0.78;

    ctx.beginPath();
    ctx.moveTo(-sx, -sy);
    ctx.lineTo(sx, sy);
    ctx.strokeStyle = "rgba(95, 90, 80, 0.32)";
    ctx.lineWidth = 1.4 * scale;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-sx, -sy + 0.8);
    ctx.lineTo(sx, sy + 0.8);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
    ctx.lineWidth = 1.0 * scale;
    ctx.stroke();

    ctx.restore();
    ctx.restore();
  }

  // Draw 3D Medical Cross (mostly upright, rose gradient)
  function drawCross(o, px, py){
    const scale = (0.55 + o.z * 0.45);
    const alpha = (0.22 + o.z * 0.48);
    const L = 27 * scale;
    const W = 9.5 * scale;
    const r = 2.5 * scale;

    ctx.save();
    ctx.translate(px, py);
    const uprightRot = Math.sin(o.phase + o.rot * 0.2) * 0.14;
    ctx.rotate(uprightRot);
    ctx.globalAlpha = alpha;

    // Drop shadow
    ctx.save();
    ctx.translate(0, 14 * scale);
    ctx.scale(1, 0.45);
    ctx.beginPath();
    ctx.arc(0, 0, L * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(10, 20, 25, 0.18)";
    ctx.fill();
    ctx.restore();

    // Soft rose gradient #d99199 to #a65763
    const crossGrad = ctx.createLinearGradient(-L / 2, -L / 2, L / 2, L / 2);
    crossGrad.addColorStop(0, "#d99199");
    crossGrad.addColorStop(1, "#a65763");

    function drawRoundedArm(cx, cy, w, h, rad){
      if(ctx.roundRect){
        ctx.beginPath();
        ctx.roundRect(cx - w/2, cy - h/2, w, h, rad);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.rect(cx - w/2, cy - h/2, w, h);
        ctx.fill();
      }
    }

    ctx.fillStyle = crossGrad;
    drawRoundedArm(0, 0, W, L, r);
    drawRoundedArm(0, 0, L, W, r);

    // Bevel highlights
    ctx.save();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
    ctx.lineWidth = 1.2 * scale;
    ctx.beginPath();
    ctx.moveTo(-W/2, -L/2 + r);
    ctx.lineTo(-W/2, -W/2);
    ctx.lineTo(-L/2 + r, -W/2);
    ctx.stroke();

    ctx.strokeStyle = "rgba(0, 0, 0, 0.22)";
    ctx.lineWidth = 1.2 * scale;
    ctx.beginPath();
    ctx.moveTo(W/2, L/2 - r);
    ctx.lineTo(W/2, W/2);
    ctx.lineTo(L/2 - r, W/2);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  let lastTime = performance.now();

  function renderFrame(now){
    ctx.clearRect(0, 0, width, height);

    // Mouse parallax interpolation
    mouseX += (targetMouseX - mouseX) * 0.05;
    mouseY += (targetMouseY - mouseY) * 0.05;

    for(let i = 0; i < objects.length; i++){
      const o = objects[i];
      const px = o.x + mouseX * 32 * o.z;
      const py = o.y + mouseY * 32 * o.z;

      if(o.type === 'capsule'){
        drawCapsule(o, px, py);
      } else if(o.type === 'tablet'){
        drawTablet(o, px, py);
      } else if(o.type === 'cross'){
        drawCross(o, px, py);
      }
    }
  }

  function loop(now){
    if(!isRunning) return;
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    for(let i = 0; i < objects.length; i++){
      const o = objects[i];

      o.y -= o.baseSpeed * (0.35 + o.z * 0.65);
      o.phase += o.swaySpeed * 60 * dt;
      o.x += Math.sin(o.phase) * (0.3 + o.z * 0.4);

      o.rot += o.rotSpeed * 60 * dt;
      o.pitch += o.pitchSpeed * 60 * dt;

      if(o.y < -70){
        o.y = height + 60 + Math.random() * 40;
        o.x = Math.random() * width;
        o.z = 0.35 + Math.random() * 0.65;
        o.phase = Math.random() * Math.PI * 2;
      }
    }

    renderFrame(now);
    animId = requestAnimationFrame(loop);
  }

  function startAnimation(){
    if(prefersReduced){
      renderFrame(0);
      return;
    }
    if(!isRunning && isVisible){
      isRunning = true;
      lastTime = performance.now();
      animId = requestAnimationFrame(loop);
    }
  }

  function stopAnimation(){
    isRunning = false;
    if(animId){
      cancelAnimationFrame(animId);
      animId = null;
    }
  }

  document.addEventListener("visibilitychange", () => {
    isVisible = !document.hidden;
    if(isVisible){
      startAnimation();
    } else {
      stopAnimation();
    }
  });

  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    mq.addEventListener && mq.addEventListener('change', e => {
      prefersReduced = e.matches;
      if(prefersReduced){
        stopAnimation();
        renderFrame(0);
      } else {
        startAnimation();
      }
    });
  }

  window.addEventListener("resize", resize, { passive: true });
  resize();
  startAnimation();
})();
</script>

<script>
/* ================= DASHBOARD ================= */
(function(){
  const D = {
    en:{dash:"Dashboard", hi:"Hello! 👋", meds:"Medicines", doses:"Doses today", taken:"Taken today", adh:"7-day adherence",
        warn:"Safety alerts", progress:"Today's progress", of:"of", done:"doses done", week:"Last 7 days",
        plan:"Today's plan", none:"No reminders yet. Scan a medicine to start.", next:"Next dose", in:"in",
        sTaken:"✅ Taken", sMissed:"❌ Missed", sUp:"⏳ Upcoming", sDue:"🔔 Due now", allDone:"All done for today 🎉",
        h:"h", m:"min", days:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
        medsSub:"in your list", dosesSub:"still upcoming", takenSub:"of today", safeSub:"All clear", warnSub:"Needs attention"},
    ur:{dash:"ڈیش بورڈ", hi:"السلام علیکم! 👋", meds:"دوائیں", doses:"آج کی خوراکیں", taken:"آج لی گئیں", adh:"7 دن کی پابندی",
        warn:"حفاظتی انتباہ", progress:"آج کی پیش رفت", of:"میں سے", done:"خوراکیں مکمل", week:"پچھلے 7 دن",
        plan:"آج کا پلان", none:"ابھی کوئی یاد دہانی نہیں۔ دوا اسکین کریں۔", next:"اگلی خوراک", in:"باقی",
        sTaken:"✅ لے لی", sMissed:"❌ رہ گئی", sUp:"⏳ آنے والی", sDue:"🔔 ابھی وقت ہے", allDone:"آج کی تمام خوراکیں مکمل 🎉",
        h:"گھنٹے", m:"منٹ", days:["اتوار","پیر","منگل","بدھ","جمعرات","جمعہ","ہفتہ"],
        medsSub:"آپ کی فہرست میں", dosesSub:"باقی ہیں", takenSub:"آج کا", safeSub:"سب ٹھیک ہے", warnSub:"توجہ درکار ہے"}
  };
  const d = k => D[lang][k];
  const dstr = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");

  function animateValue(id, start, end, duration) {
    const el = document.getElementById(id);
    if (!el) return;
    const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
      el.textContent = end;
      return;
    }
    el.textContent = start;
    let startTime = null;
    const step = (timestamp) => {
      if (!startTime) startTime = timestamp;
      const progress = Math.min((timestamp - startTime) / duration, 1);
      el.textContent = Math.floor(progress * (end - start) + start);
      if (progress < 1) {
        window.requestAnimationFrame(step);
      }
    };
    window.requestAnimationFrame(step);
  }

  function renderDash(){
    const dashBody = document.getElementById("dashBody");
    if(!dashBody) return;
    const today = todayStr(), now = nowHM();
    const active = reminders.filter(r => r.on && medById(r.medId)).sort((a,b)=>a.time.localeCompare(b.time));
    const todayHist = history.filter(h => h.date === today);
    const takenToday = todayHist.filter(h => h.status === "taken").length;
    const total = Math.max(active.length, todayHist.length);
    const pct = total ? Math.round(takenToday / total * 100) : 0;
    const upcomingCount = active.filter(r => r.time > now).length;

    const days = [];
    for(let i=6;i>=0;i--){
      const dt = new Date(); dt.setDate(dt.getDate()-i);
      const ds = dstr(dt), hs = history.filter(h => h.date === ds);
      const tk = hs.filter(h => h.status === "taken").length;
      days.push({label:d("days")[dt.getDay()], pct: hs.length ? Math.round(tk/hs.length*100) : 0, has: hs.length > 0});
    }
    const withData = days.filter(x => x.has);
    const adh = withData.length ? Math.round(withData.reduce((s,x)=>s+x.pct,0)/withData.length) : 0;
    const warnCount = checkWarnings().length;

    const used = {};
    const plan = active.map(r => {
      const name = medById(r.medId).brand || medById(r.medId).generic;
      const h = todayHist.find((x,i) => x.med === name && !used[i] && (used[i]=true));
      let st = h ? (h.status === "taken" ? "taken" : "missed") : (r.time > now ? "up" : "due");
      return {r, name, st};
    });
    const nextR = plan.find(p => p.st === "up");
    let countdown = "";
    if(nextR){
      const [hh,mm] = nextR.r.time.split(":").map(Number), n = new Date();
      const mins = hh*60+mm - (n.getHours()*60+n.getMinutes());
      countdown = (mins >= 60 ? Math.floor(mins/60)+" "+d("h")+" " : "") + (mins%60)+" "+d("m");
    }

    const dateTxt = new Date().toLocaleDateString(lang==="ur" ? "ur-PK" : "en-GB", {weekday:"long", day:"numeric", month:"long"});
    const chip = {taken:["c-taken","sTaken"], missed:["c-missed","sMissed"], up:["c-up","sUp"], due:["c-due","sDue"]};
    const pn = window.getProfileName ? getProfileName() : "";
    let hello = "";
    if(lang === "ur"){
      hello = pn ? `السلام علیکم، ${esc(pn)}!` : d("hi");
    } else {
      hello = pn ? `Hello, ${esc(pn)}!` : `Hello! 👋`;
    }

    document.getElementById("dashBody").innerHTML = `
      <div class="d-top-row ${nextR || active.length ? 'has-side' : 'single'}">
        <div class="d-hello"><h2>${hello}</h2><p>${ICON.calendarWhite} ${esc(dateTxt)}</p></div>

        ${nextR ? `<div class="d-next"><div>${ICON.alarmClockWhite}</div>
          <div><div style="opacity:.9;font-weight:700">${d("next")} · ${d("in")} ${esc(countdown)}</div>
          <div class="big-t">${esc(nextR.r.time)} — ${esc(nextR.name)}</div></div></div>`
          : (active.length ? `<div class="banner green d-next-fallback">${d("allDone")}</div>` : "")}
      </div>

      <div class="d-grid">
        <div class="d-stat lively anim-up" style="animation-delay:0s">
          <div class="ic-wrap">
            <div class="ic-glow" style="background:#2a8a84"></div>
            <div class="ic" style="background:linear-gradient(135deg,#2a8a84,#4fa383)">${ICON.pillWhite}</div>
          </div>
          <div class="num" id="stat-meds">${meds.length}</div>
          <div class="lbl">${d("meds")}</div>
          <div class="sub-lbl">${d("medsSub")}</div>
        </div>
        <div class="d-stat lively anim-up" style="animation-delay:0.08s">
          <div class="ic-wrap">
            <div class="ic-glow" style="background:#5c6bb5"></div>
            <div class="ic" style="background:linear-gradient(135deg,#5c6bb5,#4fa383)">${ICON.clockWhite}</div>
          </div>
          <div class="num" id="stat-doses">${active.length}</div>
          <div class="lbl">${d("doses")}</div>
          <div class="sub-lbl">${upcomingCount} ${d("dosesSub")}</div>
        </div>
        <div class="d-stat lively anim-up" style="animation-delay:0.16s">
          <div class="ic-wrap">
            <div class="ic-glow" style="background:#2a8a84"></div>
            <div class="ic" style="background:linear-gradient(135deg,#2a8a84,#3e9c7f)">${ICON.checkWhite}</div>
          </div>
          <div class="num" id="stat-taken">${takenToday}</div>
          <div class="lbl">${d("taken")}</div>
          <div class="sub-lbl">${lang==="ur"?d("takenSub")+" ":""}${pct}%${lang==="en"?" "+d("takenSub"):""}</div>
          <div class="mini-progress"><div class="fill" style="width:${pct}%"></div></div>
        </div>
        <div class="d-stat lively anim-up" style="animation-delay:0.24s">
          <div class="ic-wrap">
            <div class="ic-glow" style="background:${warnCount?"#c4757c":"#64737b"}"></div>
            <div class="ic" style="background:${warnCount?"#c4757c":"#64737b"}">${ICON.shieldWhite}</div>
          </div>
          <div class="num" id="stat-warn">${warnCount}</div>
          <div class="lbl">${d("warn")}</div>
          <div class="sub-lbl ${warnCount?'warn-text':'safe-text'}">${warnCount?d("warnSub"):d("safeSub")}</div>
        </div>
      </div>

      <div class="d-mid-grid">
        <div class="card"><h3 style="margin:0 0 12px">${d("progress")}</h3>
          <div class="d-ringwrap"><div class="d-ring" style="--p:${pct}"><span>${pct}%</span></div>
            <div><div style="font-size:30px;font-weight:800">${takenToday} ${d("of")} ${total}</div><div class="muted">${d("done")}</div>
            <div class="muted" style="margin-top:8px">${d("adh")}: <b style="color:#2c6f69">${adh}%</b></div></div></div>
        </div>

        <div class="card"><h3 style="margin:0"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#2a8a84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px;display:inline-block"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>${d("week")}</h3>
          <div class="d-bars">${days.map(x=>`<div class="d-bar"><span style="margin-bottom:4px">${x.has?x.pct+"%":""}</span>
            <i class="${x.has?"":"empty"}" style="height:${x.has?Math.max(x.pct,4):4}%"></i><span style="margin-top:6px">${esc(x.label.slice(0,3))}</span></div>`).join("")}</div>
        </div>
      </div>

      <div class="card d-plan-card"><h3 style="margin:0 0 6px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#2a8a84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px;display:inline-block"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${d("plan")}</h3>
        ${plan.length ? plan.map(p=>`<div class="d-item"><span class="d-time">${esc(p.r.time)}</span><span>${ICON.pillTeal} ${esc(p.name)}</span>
          <span class="d-chip ${chip[p.st][0]}">${d(chip[p.st][1])}</span></div>`).join("") : `<p class="muted">${d("none")}</p>`}
      </div>`;
  }

  const origRender = window.renderAll || function(){};
  window.renderAll = function(){ origRender(); renderDash(); };
  setInterval(() => { if(document.getElementById("home")?.classList.contains("active")) renderDash(); }, 30000);
  
  function triggerDashAnims(m, a, t, w){
    const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(prefersReduced) return;
    animateValue("stat-meds", 0, m, 800);
    animateValue("stat-doses", 0, a, 800);
    animateValue("stat-taken", 0, t, 800);
    animateValue("stat-warn", 0, w, 800);
  }

  let observer = null;
  function initObserver() {
    const home = document.getElementById("home");
    if (!home) return;
    observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
          if (home.classList.contains('active')) {
            renderDash();
            const today = todayStr();
            const active = reminders.filter(r => r.on && medById(r.medId));
            const todayHist = history.filter(h => h.date === today);
            const takenToday = todayHist.filter(h => h.status === "taken").length;
            const warnCount = checkWarnings().length;
            triggerDashAnims(meds.length, active.length, takenToday, warnCount);
          }
        }
      });
    });
    observer.observe(home, { attributes: true });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initObserver);
  } else {
    initObserver();
  }

  renderDash();
  // If already active on load, trigger anims
  setTimeout(() => {
    const home = document.getElementById("home");
    if(home && home.classList.contains('active')) {
      const today = todayStr();
      const active = reminders.filter(r => r.on && medById(r.medId));
      const todayHist = history.filter(h => h.date === today);
      const takenToday = todayHist.filter(h => h.status === "taken").length;
      const warnCount = checkWarnings().length;
      triggerDashAnims(meds.length, active.length, takenToday, warnCount);
    }
  }, 100);
})();
</script>

<script>
/* ================= PROFILE + LOGIN ================= */
(function(){
  const P = {
    en:{profile:"My Profile", create:"Create your profile", createSub:"Set up MedLens for yourself or a loved one.",
        name:"Full name", start:"Create & Continue", welcome:"Welcome back",
        enterPin:"Enter your PIN", login:"Login", forgot:"Forgot PIN? Reset profile", wrong:"Wrong PIN. Try again.",
        needName:"Please enter your name.", pinRule:"PIN must be 4 digits.", pinMatch:"PINs do not match.",
        resetQ:"Reset the profile on this device? Medicines and reminders will stay.",
        age:"Age", gender:"Gender", blood:"Blood group", allergies:"Allergies (comma separated)", conditions:"Health conditions",
        ec:"Emergency contact", ecName:"Contact name", ecPhone:"Contact phone", save:"Save Profile", saved:"Profile saved ✓",
        logout:"Logout", call:"Call", medical:"Medical info", male:"Male", female:"Female", other:"Other", yrs:"yrs",
        allergyWarn:"⚠️ Allergy alert: you noted an allergy to", changePin:"New PIN (optional)"},
    ur:{profile:"میری پروفائل", create:"اپنی پروفائل بنائیں", createSub:"اپنے یا اپنے کسی پیارے کے لیے میڈلینز سیٹ کریں۔",
        name:"پورا نام", start:"بنائیں اور آگے بڑھیں", welcome:"خوش آمدید",
        enterPin:"اپنا پن لکھیں", login:"لاگ اِن", forgot:"پن بھول گئے؟ پروفائل ری سیٹ کریں", wrong:"غلط پن۔ دوبارہ کوشش کریں۔",
        needName:"براہِ کرم اپنا نام لکھیں۔", pinRule:"پن 4 ہندسوں کا ہونا چاہیے۔", pinMatch:"دونوں پن ایک جیسے نہیں۔",
        resetQ:"اس ڈیوائس پر پروفائل ری سیٹ کریں؟ دوائیں اور یاد دہانیاں محفوظ رہیں گی۔",
        age:"عمر", gender:"جنس", blood:"بلڈ گروپ", allergies:"الرجی (کاما سے الگ کریں)", conditions:"بیماریاں",
        ec:"ہنگامی رابطہ", ecName:"رابطے کا نام", ecPhone:"رابطے کا فون", save:"پروفائل محفوظ کریں", saved:"پروفائل محفوظ ہو گئی ✓",
        logout:"لاگ آؤٹ", call:"کال کریں", medical:"طبی معلومات", male:"مرد", female:"عورت", other:"دیگر", yrs:"سال",
        allergyWarn:"⚠️ الرجی کا انتباہ: آپ کو اس سے الرجی ہے", changePin:"نیا پن (اختیاری)"}
  };
  const p = k => P[lang][k];
  const getProfile = () => load("ml_profile", null);
  const isLogged = () => { try{ return sessionStorage.getItem("ml_logged")==="1"; }catch(e){ return false; } };
  const setLogged = v => { try{ v ? sessionStorage.setItem("ml_logged","1") : sessionStorage.removeItem("ml_logged"); }catch(e){} };
  const initials = n => (n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  async function hash(s){
    try{ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("medlens:"+s));
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
    catch(e){ return "plain:"+s; }
  }
  window.getProfileName = () => (getProfile()||{}).name || "";


  const sec = document.createElement("section");
  sec.id = "profile"; sec.className = "screen";
  sec.innerHTML = `<button class="small secondary" onclick="show('home')">${ICON.back} <span data-t="back"></span></button><div id="profileBody"></div>`;
  document.querySelector("main").appendChild(sec);

  function renderAuth(err){
    const pr = getProfile(), card = document.getElementById("authCard");
    if(!pr){
      card.innerHTML = `<div class="avatar">💊</div><h2>${p("create")}</h2><p class="muted">${p("createSub")}</p>
        <input id="aName" placeholder="${p("name")}">
        <input id="aPin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="margin-top:10px">
        <input id="aPin2" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="margin-top:10px">
        <div class="auth-err">${err||""}</div>
        <button class="big primary" onclick="MLAuth.create()">✨ ${p("start")}</button>
        <button class="link-btn" onclick="toggleLang();MLAuth.render()">${lang==="ur"?"English":"اردو"}</button>`;
    }else{
      card.innerHTML = `<div class="avatar">${esc(initials(pr.name))}</div><h2>${p("welcome")}, ${esc(pr.name)}!</h2>
        <p class="muted">${p("enterPin")}</p>
        <input id="aPin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"
          onkeydown="if(event.key==='Enter')MLAuth.login()">
        <div class="auth-err">${err||""}</div>
        <button class="big primary" onclick="MLAuth.login()">🔓 ${p("login")}</button>
        <button class="link-btn" onclick="MLAuth.reset()">${p("forgot")}</button><br>
        <button class="link-btn" onclick="toggleLang();MLAuth.render()">${lang==="ur"?"English":"اردو"}</button>`;
    }
  }
  function lock(){ 
    setLogged(false); 
    renderAuth(); 
    document.getElementById("login").classList.add("show"); 
    document.getElementById("dock")?.classList.add("hidden");
  }
  window.lock = lock;
  window.isLogged = isLogged;
  function unlockScreen(){ 
    document.getElementById("login").classList.remove("show"); 
    document.getElementById("dock")?.classList.remove("hidden");
    show("home"); 
  }

  window.MLAuth = {
    render: () => renderAuth(),
    async create(){
      const name = document.getElementById("aName").value.trim();
      const a = document.getElementById("aPin").value, b = document.getElementById("aPin2").value;
      if(!name) return renderAuth(p("needName"));
      if(!/^\d{4}$/.test(a)) return renderAuth(p("pinRule"));
      if(a!==b) return renderAuth(p("pinMatch"));
      store("ml_profile", {name, pinHash: await hash(a), age:"", gender:"", blood:"", allergies:"", conditions:"", ecName:"", ecPhone:""});
      setLogged(true); 
      unlockScreen();
    },
    async login(){
      const pin = document.getElementById("aPin").value;
      if(await hash(pin) === getProfile().pinHash){ setLogged(true); unlockScreen(); }
      else renderAuth(p("wrong"));
    },
    reset(){ if(confirm(p("resetQ"))){ try{ localStorage.removeItem("ml_profile"); }catch(e){} renderAuth(); } },
    async save(){
      const pr = getProfile() || {};
      ["name","age","gender","blood","allergies","conditions","ecName","ecPhone"].forEach(k => {
        const el = document.getElementById("pf_"+k); if(el) pr[k] = el.value.trim();
      });
      const np = document.getElementById("pf_pin").value;
      if(np){ if(!/^\d{4}$/.test(np)) return alert(p("pinRule")); pr.pinHash = await hash(np); }
      store("ml_profile", pr); alert(p("saved")); renderAll();
    },
    logout: lock
  };

  function renderProfile(){
    const pr = getProfile();
    const av = document.getElementById("tbAvatarText");
    if(av) av.textContent = pr && pr.name ? initials(pr.name) : "👤";
    sec.querySelector("[data-t=back]").textContent = t("back");
    if(!pr){ document.getElementById("profileBody").innerHTML = ""; return; }
    const tags = [pr.age && pr.age+" "+p("yrs"), pr.gender && p(pr.gender), pr.blood && "🩸 "+pr.blood].filter(Boolean);
    const opt = (v,l) => `<option value="${v}" ${pr.gender===v?"selected":""}>${l}</option>`;
    const bopt = ["","A+","A-","B+","B-","AB+","AB-","O+","O-"].map(b=>`<option ${pr.blood===b?"selected":""}>${b}</option>`).join("");
    document.getElementById("profileBody").innerHTML = `
      <div class="p-head"><div class="avatar">${esc(initials(pr.name))}</div>
        <div><h2>${esc(pr.name)}</h2><div class="p-tags">${tags.map(x=>`<span class="p-tag">${esc(x)}</span>`).join("")}</div></div></div>

      ${pr.ecPhone ? `<a class="big warn" style="text-decoration:none" href="tel:${esc(pr.ecPhone)}">📞 ${p("call")} ${esc(pr.ecName||pr.ecPhone)}</a>` : ""}

      <div class="card"><h3 style="margin:0"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#2a8a84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px;display:inline-block"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${p("profile")}</h3>
        <label>${p("name")}</label><input id="pf_name" value="${esc(pr.name)}">
        <div class="p-grid">
          <div><label>${p("age")}</label><input id="pf_age" type="number" min="0" max="120" value="${esc(pr.age)}"></div>
          <div><label>${p("gender")}</label><select id="pf_gender">${opt("","—")}${opt("male",p("male"))}${opt("female",p("female"))}${opt("other",p("other"))}</select></div>
        </div>
        <label>${p("blood")}</label><select id="pf_blood">${bopt}</select>
      </div>

      <div class="card"><h3 style="margin:0"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#2a8a84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px;display:inline-block"><path d="M4.8 2.3A.3.3 0 0 0 4.5 2.6V7a5 5 0 0 0 10 0V2.6a.3.3 0 0 0-.3-.3h-1.4a.3.3 0 0 0-.3.3V7a3 3 0 0 1-6 0V2.6a.3.3 0 0 0-.3-.3z"/><path d="M9.5 12v3a4 4 0 0 0 4 4h1a4 4 0 0 0 4-4v-1.5"/><circle cx="18.5" cy="12.5" r="1.5"/></svg>${p("medical")}</h3>
        <label>${p("allergies")}</label><input id="pf_allergies" value="${esc(pr.allergies)}" placeholder="penicillin, aspirin">
        <label>${p("conditions")}</label><input id="pf_conditions" value="${esc(pr.conditions)}" placeholder="diabetes, blood pressure">
      </div>

      <div class="card"><h3 style="margin:0"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#c4757c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px;display:inline-block"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>${p("ec")}</h3>
        <label>${p("ecName")}</label><input id="pf_ecName" value="${esc(pr.ecName)}">
        <label>${p("ecPhone")}</label><input id="pf_ecPhone" type="tel" value="${esc(pr.ecPhone)}" placeholder="03xx xxxxxxx">
        <label>${p("changePin")}</label><input id="pf_pin" class="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
      </div>

      <button class="big primary" onclick="MLAuth.save()">💾 ${p("save")}</button>
      <button class="big secondary" onclick="MLAuth.logout()">🚪 ${p("logout")}</button>`;
  }

  const origWarn = window.checkWarnings || function(){return [];};
  window.checkWarnings = function(){
    const out = origWarn();
    const al = ((getProfile()||{}).allergies||"").toLowerCase().split(",").map(s=>s.trim()).filter(s=>s.length>2);
    meds.forEach(m => {
      const g = ((m.generic||"")+" "+(m.brand||"")).toLowerCase();
      al.forEach(a => { if(g.includes(a)) out.unshift({cls:"red", text:`${p("allergyWarn")} "${a}": ${m.brand||m.generic}`}); });
    });
    return out;
  };

  const origRender = window.renderAll || function(){};
  window.renderAll = function(){ origRender(); renderProfile(); };
  renderProfile();
  if(!isLogged()){
    lock();
  } else {
    document.getElementById("dock")?.classList.remove("hidden");
    show("home");
  }
})();
</script>

    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span class="dock-lbl" data-dock="home">Home</span>
    <span class="dock-line"></span>
  </button>

  <button class="dock-btn" onclick="show('meds')" id="dock-meds">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="10" x="3" y="7" rx="5" transform="rotate(-45 12 12)"/>
